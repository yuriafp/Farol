name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly too: the runner image updates Visual Studio, the SDK and MSBuild under unchanged code.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows with Visual Studio 2026 (MSBuild 18): the legacy fixtures load and build with Visual Studio's MSBuild,
    # and their tests run under vstest.console.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Farol.slnx -c Release

      - name: Test
        run: dotnet test --solution Farol.slnx -c Release --no-build

  linux:
    # Linux has no MSBuild that can evaluate .NET Framework projects: the legacy fixtures load through the heuristic
    # loader (spec 002, AC-70), and the tests that need Visual Studio's MSBuild skip themselves.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Farol.slnx -c Release

      - name: Test
        run: dotnet test --solution Farol.slnx -c Release --no-build

      # server.json against the MCP Registry's schema and rules (spec 002, AC-69), with the CLI the Registry workflow uses.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Validate server.json
        working-directory: src/Farol.Host/.mcp
        run: |
          bash "$GITHUB_WORKSPACE/.github/scripts/install-mcp-publisher.sh" "$(grep -oP 'MCP_PUBLISHER_VERSION: \K\S+' "$GITHUB_WORKSPACE/.github/workflows/registry.yml")"
          ./mcp-publisher validate
          rm mcp-publisher
