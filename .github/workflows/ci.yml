name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Weekly too: the runner image updates Visual Studio, the SDK and MSBuild under unchanged code.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    # Windows with Visual Studio 2026 (MSBuild 18): the legacy fixtures load and build with Visual Studio's MSBuild,
    # and their tests run under vstest.console.
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build Farol.slnx -c Release

      - name: Test
        run: dotnet test --solution Farol.slnx -c Release --no-build
