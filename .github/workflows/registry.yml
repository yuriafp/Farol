name: MCP Registry

# Publishes src/Farol.Host/.mcp/server.json to the MCP Registry (io.github.yuriafp/farol) with GitHub OIDC when a GitHub
# release is published (spec 002, AC-69). It does not wait for the Published package check; the Registry verifies the
# package on nuget.org itself (the mcp-name line in the package README), so it retries while nuget.org indexes it. A
# failure shows here and leaves the package release as it is. Run by hand, it only validates.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.16

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher
        working-directory: src/Farol.Host/.mcp
        run: bash "$GITHUB_WORKSPACE/.github/scripts/install-mcp-publisher.sh" "$MCP_PUBLISHER_VERSION"

      # The listing names the release's version: server.json was set to it with the rest of the release (docs/release.md).
      - name: Check the version
        if: github.event_name == 'release'
        working-directory: src/Farol.Host/.mcp
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          listed="$(jq -r '.version' server.json)"
          packaged="$(jq -r '.packages[0].version' server.json)"
          if [ "$listed" != "$version" ] || [ "$packaged" != "$version" ]; then
            echo "server.json names $listed (package $packaged), the release is $version."
            exit 1
          fi

      - name: Validate
        working-directory: src/Farol.Host/.mcp
        run: ./mcp-publisher validate

      - name: Log in with GitHub OIDC
        if: github.event_name == 'release'
        working-directory: src/Farol.Host/.mcp
        run: ./mcp-publisher login github-oidc

      # nuget.org can take minutes to list a package pushed just before the release.
      - name: Publish
        if: github.event_name == 'release'
        working-directory: src/Farol.Host/.mcp
        run: |
          for attempt in $(seq 1 20); do
            if ./mcp-publisher publish; then exit 0; fi
            echo "Attempt $attempt failed; trying again in 60 s."
            sleep 60
          done
          exit 1
