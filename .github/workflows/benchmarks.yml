name: Benchmarks

# AC-35 of spec 001: Farol's latency and memory targets, measured on pinned open-source solutions (benchmarks/README.md).
on:
  push:
    branches: [main]
    paths: ['src/**', 'benchmarks/**', '.github/workflows/benchmarks.yml']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: ${{ matrix.corpus }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        corpus: [umbraco, dnn-platform]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build benchmarks/Farol.Benchmarks -c Release

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ matrix.corpus }}-${{ hashFiles(format('benchmarks/corpora/{0}.json', matrix.corpus)) }}

      - name: Prepare the corpus
        shell: pwsh
        run: ./benchmarks/prepare.ps1 -Corpus ${{ matrix.corpus }} -Destination "${{ runner.temp }}/corpus"

      # Fails when a target is missed or a call fails; the report becomes the job summary.
      - name: Benchmark
        run: dotnet benchmarks/Farol.Benchmarks/bin/Release/net10.0/Farol.Benchmarks.dll --corpus benchmarks/corpora/${{ matrix.corpus }}.json --repo "${{ runner.temp }}/corpus" --out artifacts/benchmarks/${{ matrix.corpus }}

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.corpus }}
          path: artifacts/benchmarks/${{ matrix.corpus }}
